<main
  class="auth-shell"
  [class.login-shell]="loginMode()"
  [class.account-selection-shell]="accountSelectionMode()"
  [class.customer-registration-shell]="customerRegistrationMode()"
  [class.shop-registration-shell]="shopRegistrationMode()"
>
  <header class="auth-header">
    <a class="brand" routerLink="/login" aria-label="Reparo home">
      <span class="brand-mark" aria-hidden="true"><img src="/reparo-mark.svg" alt="" /></span>
      <span>Repar<span class="brand-accent">o</span></span>
    </a>
    <span class="header-note">Find. Repair. Relax.</span>
  </header>

  <section
    class="auth-main"
    [class.registration-mode]="registrationMode()"
    [class.login-mode]="loginMode()"
    [class.account-selection-mode]="accountSelectionMode()"
    [class.customer-registration-mode]="customerRegistrationMode()"
    [class.shop-registration-mode]="shopRegistrationMode()"
  >
    <div class="welcome-copy">
      <span class="eyebrow">A BETTER WAY TO REPAIR</span>
      <h1 id="welcome-title">
        <span>Your next repair</span>
        <span class="headline-accent">starts here.</span>
      </h1>
      <p>Find trusted repair shops for the electronics you rely on every day.</p>
      <div class="auth-benefits" aria-label="Reparo benefits">
        <article class="auth-benefit">
          <span class="benefit-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4l-3.1 3.1-3-3 3.1-3.1Z"
              />
            </svg>
          </span>
          <span class="benefit-title">Trusted Shops</span>
          <span class="benefit-caption">Verified &amp; rated</span>
        </article>
        <article class="auth-benefit">
          <span class="benefit-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="m13 2-9 12h7l-1 8 10-13h-7l1-7Z" />
            </svg>
          </span>
          <span class="benefit-title">Quick Quotations</span>
          <span class="benefit-caption">Compare &amp; choose</span>
        </article>
        <article class="auth-benefit">
          <span class="benefit-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="m12 3 8 3v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-3Z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
          </span>
          <span class="benefit-title">Safe &amp; Reliable</span>
          <span class="benefit-caption">Track your repair</span>
        </article>
      </div>
    </div>
    <div class="auth-panel">
      <router-outlet (activate)="setContentMode($event)" />
    </div>
  </section>

  <footer
    class="auth-footer"
    [class.login-footer]="loginMode()"
    [class.account-selection-footer]="accountSelectionMode()"
    [class.customer-registration-footer]="customerRegistrationMode()"
    [class.shop-registration-footer]="shopRegistrationMode()"
  >
    <span>Reparo</span>
    <span>Find. Repair. Relax.</span>
  </footer>
</main>

<main class="jobs-page">
  <app-admin-page-header>
    <h1 adminPageTitle class="admin-page-title" id="shop-completed-jobs-title">{{ title }}</h1>
    <p adminPageDescription class="admin-page-description">{{ description }}</p>
    <div adminPageActions class="header-actions">
      <label class="search-control">
        <input
          type="search"
          placeholder="Search ID, device, brand, customer or issue"
          aria-label="Search completed jobs by ID, device, brand, customer, or issue"
          [value]="search()"
          (input)="setSearch($any($event.target).value)"
        />
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" /><path d="m16 16 4 4" /></svg>
      </label>
      <app-common-filter
        [config]="filterConfig"
        [appliedFilters]="appliedFilters()"
        (filtersChange)="applyFilters($event)"
      />
      <label class="toolbar-select">
        <span>Status</span>
        <select [value]="statusFilter()" (change)="setStatusFilter($any($event.target).value)">
          <option value="">All statuses</option>
          @for (status of statusOptions(); track status) {
            <option [value]="status">{{ status.replaceAll('_', ' ') | titlecase }}</option>
          }
        </select>
      </label>
      <label class="toolbar-select">
        <span>Sort by</span>
        <select [value]="sort()" (change)="setSort($any($event.target).value)">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </label>
    </div>
  </app-admin-page-header>

  @if (loading()) {
    <p class="loading-state" role="status">Loading completed jobs...</p>
  } @else if (error()) {
    <section class="error-state" role="alert">
      <h2>Completed Jobs could not be loaded</h2>
      <p>{{ error() }}</p>
      <button class="job-button" type="button" (click)="reload()">Try again</button>
    </section>
  } @else if (!filteredItems().length) {
    <app-empty-state
      [title]="search() ? 'No matching jobs' : 'No completed jobs'"
      [description]="search() ? 'Try another device, customer, or job ID.' : 'Finished repairs will appear here.'"
    />
  } @else {
    <app-shop-jobs-table [jobs]="pageItems()" [detailRoute]="detailRoute" title="Completed Jobs">
      @if (filteredItems().length > 0) {
        <app-job-pagination
          variant="brand"
          [total]="filteredItems().length"
          [page]="page()"
          [pageSize]="pageSize()"
          (pageChange)="setPage($event)"
          (pageSizeChange)="setPageSize($event)"
        />
      }
    </app-shop-jobs-table>
  }
</main>

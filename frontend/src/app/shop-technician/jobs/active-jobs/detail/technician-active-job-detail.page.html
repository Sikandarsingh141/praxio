<main class="job-detail-page technician-active-job-detail-page">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a [routerLink]="backRoute">{{ backLabel }}</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">Repair details</span>
  </nav>
  @if (loading()) {
    <p class="state" role="status">Loading repair details...</p>
  } @else if (error()) {
    <p class="state error" role="alert">{{ error() }}</p>
  } @else if (record(); as job) {
    <header class="detail-heading">
      <div>
        <p class="eyebrow">ACTIVE REPAIR #{{ job.id.slice(-8).toUpperCase() }}</p>
        <h1>{{ pageTitle }}</h1>
        <p>{{ job.appliance }} {{ job.brand }} {{ job.model }}</p>
      </div>
      <app-job-status-badge [status]="job.repairJobDetails?.status ?? job.status" />
    </header>
    <app-technician-repair-detail-sections [job]="job" />
  }
</main>

<main class="jobs-page">
  <app-admin-page-header>
    <h1 adminPageTitle class="admin-page-title" id="technician-completed-jobs-title">{{ title }}</h1>
    <p adminPageDescription class="admin-page-description">{{ description }}</p>
    <div adminPageActions class="header-actions">
      <label class="search-control">
        <input
          type="search"
          placeholder="Search ID, device, customer, or issue"
          aria-label="Search completed repairs by ID, device, customer, or issue"
          [value]="search()"
          (input)="setSearch($any($event.target).value)"
        />
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" /><path d="m16 16 4 4" /></svg>
      </label>
      <app-common-filter
        [config]="filterConfig"
        [appliedFilters]="appliedFilters()"
        (filtersChange)="applyFilters($event)"
      />
    </div>
  </app-admin-page-header>

  @if (loading()) {
    <p class="loading-state" role="status">Loading completed repairs...</p>
  } @else if (error()) {
    <section class="error-state" role="alert">
      <h2>Completed Repairs could not be loaded</h2>
      <p>{{ error() }}</p>
      <button class="job-button" type="button" (click)="reload()">Try again</button>
    </section>
  } @else if (!filteredItems().length) {
    <app-empty-state
      [title]="search() ? 'No matching repairs' : 'No completed repairs'"
      [description]="search() ? 'Try changing your search or filters.' : 'Completed repairs will appear here.'"
    />
  } @else {
    <app-shop-jobs-table
      [jobs]="pageItems()"
      [detailRoute]="detailRoute"
      title="Completed Repairs"
      dateLabel="Assigned On"
      [showAssignedDate]="true"
    >
      <app-job-pagination
        variant="brand"
        [total]="filteredItems().length"
        [page]="page()"
        [pageSize]="pageSize()"
        (pageChange)="setPage($event)"
        (pageSizeChange)="setPageSize($event)"
      />
    </app-shop-jobs-table>
  }
</main>
